## 含参数的计算、按格写的 $A^n$

```let
a = param
A = [[1, 1, a], [1, a, 1], [a, 1, 1]]
```

$|A| = \calc{det(A)} = \calc{factor(det(A))}$，所以 $a=1$、$a=-2$ 时要单独讨论。

```answer
id: q-pow
q: $B=\begin{bmatrix}2&1\\0&2\end{bmatrix}$，求 $B^n$。
answer: [[2^n, n*2^(n-1)], [0, 2^n]]
formula: n
before: B^n =
```
