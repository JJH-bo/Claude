## 常见错答和选择式的空

```cloze
id: c-diag
title: 关系词和时态
q: 选关系词，再填动词的正确形式。
text: My brother, {{[that=逗号后面（非限制性定语从句）不用 that|*who|which=which 指物，这里指人]}} lives in Beijing, {{has worked|has been working|!works=since 2010 要用现在完成时|!worked=一直到现在还在做：用现在完成时}} (work) there since 2010.
explain: 逗号后面是非限制性定语从句，指人用 who；since + 过去的时间点，用现在完成时。
```

```errfind
id: e-diag
text: Neither of the answers are correct.
wrong: are
fix: is | !were=还是复数：neither of … 做主语，谓语用单数
decoys: Neither=neither 本身没错，看谓语
explain: neither of 做主语，谓语用单数。
```

## 长难句：一层层拆、意群断句

```parse
id: p-steps
title: 一层层拆
q: 先找谓语，再找主干，最后拆从句。
answer: [S The man [RC who lives next door]] [V gave] [IO me] [DO a book].
steps: V | S IO DO | RC
explain: 谓语 gave → 主语 The man who lives next door、间接宾语 me、直接宾语 a book → 主语里 who 引导的定语从句。
```

```chunk
id: k-demo
title: 切成意群
text: The man who lives next door, / gave me a book / that I had wanted | for years.
translate: on
explain: 主语带着定语从句是一个意群；谓语和宾语一个；后面的定语从句一个。
```

## 连线、删词式改错

```link
id: lk-demo
title: 连到先行词
q: 点关系词，再点它修饰的那个名词。
text: My brother, who lives in Beijing, is a doctor.
pairs: who -> brother; !who -> Beijing=就近的名词不一定是先行词
explain: who 引导的从句修饰前面的 my brother。
```

```errfind
id: e-del
text: My bike, which I bought it last week, was stolen.
wrong: it
fix: 删掉
explain: which 已经在从句里作宾语，it 多余。
```

# 英语（语法）组件

说明书第三节里四个英语组件的例子，原样照抄。

### 填空

```cloze
title: 过去完成时
q: 用括号里动词的正确形式填空。
text: By the time we arrived, the film {{had started}} (start).
  She {{has lived|has been living}} here since 2010.
explain: 「到达」之前已经开始：过去的过去用过去完成时。
```

### 改错

```errfind
q: 找出句中的错误并改正。
text: Neither of the answers are correct.
wrong: are
fix: is
explain: neither of 做主语，谓语用单数。
```

### 句子成分

```parse
title: 拆主干
q: 标出主语、谓语、间接宾语、直接宾语，再标出主语里的定语从句。
answer: [S The man [RC who lives next door]] [V gave] [IO me] [DO a book].
roles: S V IO DO RC
explain: 先找谓语 gave，往前是主语，who 引导的定语从句修饰 the man。
```

讲解时把结构直接画在板上（`mode: show`）：

```parse
mode: show
answer: [SC What he said] [V surprised] [O everyone] [A at the meeting].
roles: SC=主语从句 V O A
```

### 句型操练

```drill
title: 主动变被动
q: 把句子改成被动语态。
count: 3
- They built this bridge in 1990. => This bridge was built in 1990.
- People say that he is rich. => He is said to be rich. | It is said that he is rich.
- Someone has stolen my bike. => My bike has been stolen.
- They will hold the meeting tomorrow. => The meeting will be held tomorrow.
```
